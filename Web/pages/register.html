<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
  <div class="container mt-5">
    <div class="register-card card p-4 mx-auto" style="max-width: 400px;">
      <h2 class="card-title text-center">Cadastro</h2>
      <form id="registerForm">
        <div class="form-group">
          <input type="text" id="new-username" class="form-control" placeholder="Username" required />
        </div>
        <div class="form-group">
          <input type="password" id="new-password" class="form-control" placeholder="Password" required />
        </div>
        <button type="submit" class="btn btn-success btn-block">Cadastrar</button>
      </form>
      <p class="text-center mt-3">
        Já tem uma conta? <a href="../index.html">Faça login</a>
      </p>
    </div>
  </div>

  <script src="../js/componentsLoader.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>

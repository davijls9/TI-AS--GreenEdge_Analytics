<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/main.css" />
</head>
<body>
  <!-- Header -->
  <div id="header-container"></div>

  <!-- Conteúdo principal da página -->
  <main class="container my-5">
    <h1 class="text-center">Perfil do Usuário</h1>
    <div class="row justify-content-center mt-4">
      <div class="col-md-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Bem-vindo, <span id="user-name"></span>!</h5>
            <p class="card-text">Aqui você pode atualizar suas informações pessoais e configurações de conta.</p>
            <form>
              <div class="form-group">
                <label for="username">Nome de Usuário</label>
                <input type="text" class="form-control" id="username" placeholder="Digite seu nome de usuário" />
              </div>
              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Digite seu email" />
              </div>
              <button type="submit" class="btn btn-primary">Atualizar Perfil</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script src="../js/componentsLoader.js"></script>
  <script src="../js/profile.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    loadComponent('#header-container', '../components/header.html');
    loadComponent('#footer-container', '../components/footer.html');
  </script>
</body>
</html>

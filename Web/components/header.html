<script>
    // Função para logout e redirecionamento
    // Função de logout
    function logout() {
        localStorage.clear(); // Limpa o armazenamento local
        window.location.href = "../index.html"; // Redireciona para a página inicial
    }

    // Verificar se o botão de toggle foi clicado
    $(document).ready(function() {
        console.log("Document ready - inicializando scripts.");
        
        $(".navbar-toggler").click(function() {
            console.log("Botão de menu responsivo clicado.");
            $("#navbarNav").toggleClass("show");
            
            if ($("#navbarNav").hasClass("show")) {
                console.log("Menu expandido.");
            } else {
                console.log("Menu recolhido.");
            }
        });
    });
</script>
